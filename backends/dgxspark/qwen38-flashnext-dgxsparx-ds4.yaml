# Qwen3.8-Flash-Next (180B MoE) on DGX Spark (GB10) — ds4 SSD-PLE (Q6)
# Portainer stack: qwen38-flashnext-dgxsparx (endpoint 4, Spark 192.168.86.39)
#
# The ds4 engine serves on :8000 inside the network; the slots-shim sidecar
# (qwen38-flashnext-slots-shim) front-terminates :8006 (router-facing) and
# exposes /slots + /health. Both containers share the stack's default network.
#
# 2026-08-29: added DS4_SHED_CONT_HOLD=off + JOB_OUT_SHED_CONT_HOLD=off.
#   The 503 "serial capacity is reserved for a live tool continuation; retry shortly"
#   was ds4 shedding requests while a serial (115k-token) session held its slot
#   for a KV continuation. With the hold shed OFF, other requests QUEUE behind the
#   live continuation (bounded by DS4_SHED_QUEUE_AGE / QUEUE_DEPTH) instead of 503ing.
#   CTX_SIZE=262144 is unchanged — the 262K signature is preserved.

services:
  qwen3.8-flashnext-dgxsparx:
    image: ds4:spark
    container_name: qwen3.8-flashnext-dgxsparx
    restart: unless-stopped
    shm_size: 64m
    working_dir: /opt/ds4
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -Eeuo pipefail

        echo
        echo "======================================================================"
        echo " Qwen3.8-Flash-Next (180B MoE) - DGX Spark (GB10) - ds4 SSD-PLE (Q6)"
        echo " ds4 cuda-spark - $${CTX_SIZE} ctx - $${COALESCE_MAX} streams"
        echo "======================================================================"
        echo " backbone  : $${MODEL}"
        echo " PLE sidecar: $${PLEDIR} (cache $${PLE_CACHE_MB} MiB, O_DIRECT)"
        echo " ctx: $${CTX_SIZE}   coalesce: $${COALESCE_MAX}   PLE workers: $${PLE_WORKERS}"
        echo "======================================================================"
        echo

        # ---- 1. Wait for the 4 backbone shards (the engine maps them itself).
        MODELDIR="$${MODELDIR}"
        nshard=$$(ls "$${MODELDIR}"/Qwen3.8-Flash-Next-MQ-Q6-SSD-PLE-BF16-0000[1-4]-of-00004.gguf 2>/dev/null | wc -l)
        want=4
        while [ "$${nshard}" -lt "$${want}" ]; do
          echo "Waiting for backbone shards ($${nshard}/$${want}) present in $${MODELDIR} ..."
          sleep 15
          nshard=$$(ls "$${MODELDIR}"/Qwen3.8-Flash-Next-MQ-Q6-SSD-PLE-BF16-0000[1-4]-of-00004.gguf 2>/dev/null | wc -l)
        done
        echo "All 4 backbone shards present in $${MODELDIR}."

        # ---- 2. Verify the PLE sidecar is complete (manifest + 4 .bin) ----
        [ -f "$${PLEDIR}/ple-manifest.json" ] || { echo "ERROR: PLE manifest missing in $${PLEDIR}"; exit 41; }
        for b in ple-bf16-00001-of-00004.bin ple-bf16-00002-of-00004.bin ple-bf16-00003-of-00004.bin ple-bf16-00004-of-00004.bin; do
          [ -f "$${PLEDIR}/$${b}" ] || { echo "ERROR: PLE sidecar missing: $${b}"; exit 41; }
        done
        echo "PLE sidecar complete (4 .bin + manifest)."

        # ---- 3. Run the ds4 server. ----
        export DS4_QWEN_PLE_CACHE_MB="$${PLE_CACHE_MB}"
        export DS4_QWEN_PLE_WORKERS="$${PLE_WORKERS}"
        export DS4_QWEN_PREFILL_CHUNK=8192
        export DS4_SERVER_COALESCE_MAX="$${COALESCE_MAX}"
        export DS4_MEMGOV=observe
        export DS4_NO_UPDATE_CHECK=1
        export DS4_CHAT_FORMAT_QWEN4EXP=1
        # --- shed the cont-hold: queue behind a live continuation instead of 503 ---
        export DS4_SHED_CONT_HOLD="$${DS4_SHED_CONT_HOLD}"
        export JOB_OUT_SHED_CONT_HOLD="$${JOB_OUT_SHED_CONT_HOLD}"

        DS4=/opt/ds4/ds4-server
        [ -x "$${DS4}" ] || { echo "ERROR: $${DS4} not found in image"; ls -la /opt/ds4/; exit 42; }

        MTP_ARGS=()
        if [ "$${USE_MTP}" = "on" ] && [ -f "$${MODELDIR}/$${MTP_FILE}" ]; then
          MTP_ARGS=( --mtp "$${MODELDIR}/$${MTP_FILE}" --mtp-draft 2 )
          echo "MTP drafter attached: $${MODELDIR}/$${MTP_FILE}"
        else
          echo "MTP spec decode off (no drafter or USE_MTP=off)."
        fi

        echo "Executing: $${DS4} -m $${MODEL} --cuda -c $${CTX_SIZE} --host 0.0.0.0 --port 8000"
        exec "$${DS4}" \
          -m "$${MODEL}" --cuda \
          -c "$${CTX_SIZE}" \
          --host 0.0.0.0 --port 8000 \
          $${MTP_ARGS[@]+"$${MTP_ARGS[@]}"}
    environment:
      # --- model / PLE sidecar (mounted from /home/darkmatter2222/models) ---
      MODEL: /models/flashnext-ds4/Qwen3.8-Flash-Next-MQ-Q6-SSD-PLE-BF16/Qwen3.8-Flash-Next-MQ-Q6-SSD-PLE-BF16-00001-of-00004.gguf
      MODELDIR: /models/flashnext-ds4/Qwen3.8-Flash-Next-MQ-Q6-SSD-PLE-BF16
      PLEDIR: /models/flashnext-ds4/Qwen3.8-Flash-Next-MQ-Q6-SSD-PLE-BF16/ple
      PLE_CACHE_MB: "512"
      PLE_WORKERS: "16"
      SHARDS: Qwen3.8-Flash-Next-MQ-Q6-SSD-PLE-BF16-00001-of-00004.gguf Qwen3.8-Flash-Next-MQ-Q6-SSD-PLE-BF16-00002-of-00004.gguf Qwen3.8-Flash-Next-MQ-Q6-SSD-PLE-BF16-00003-of-00004.gguf Qwen3.8-Flash-Next-MQ-Q6-SSD-PLE-BF16-00004-of-00004.gguf
      MTP_FILE: mtp-Qwen3.8-Flash-Next-Q4_K_M.gguf
      USE_MTP: "off"
      # --- context / concurrency ---
      CTX_SIZE: "262144"
      COALESCE_MAX: "3"
      # --- 2026-08-29: stop shedding requests while a serial session holds its
      #     continuation slot. Requests queue behind the live KV instead of 503.
      #     "off" is a safe value for a boolean knob; the binary's `strings` shows
      #     both names (DS4_SHED_CONT_HOLD, JOB_OUT_SHED_CONT_HOLD) as env keys. ---
      DS4_SHED_CONT_HOLD: "off"
      JOB_OUT_SHED_CONT_HOLD: "off"
      # --- GPU ---
      NVIDIA_VISIBLE_DEVICES: "0"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /home/darkmatter2222/models:/models:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      start_period: 150s
      retries: 40
    networks:
      - default
