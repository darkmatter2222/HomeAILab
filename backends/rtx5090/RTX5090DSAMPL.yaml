        #######################################################################
        # VLLM ARGUMENTS
        #######################################################################

        VLLM_ARGS=(

          "$${MODEL_DIR}"


          # ---------------------------------------------------------------
          # API
          # ---------------------------------------------------------------

          "--served-model-name"
          "qwen3.8"

          "--host"
          "0.0.0.0"

          "--port"
          "8006"


          # ---------------------------------------------------------------
          # TEXT ONLY
          # ---------------------------------------------------------------

          "--language-model-only"


          # ---------------------------------------------------------------
          # FULL CONTEXT
          # ---------------------------------------------------------------

          "--max-model-len"
          "$${MAX_CONTEXT}"


          # ---------------------------------------------------------------
          # ONE CLAUDE-CODE ROUTER SLOT
          # ---------------------------------------------------------------

          "--max-num-seqs"
          "$${MAX_SEQS}"


          # ---------------------------------------------------------------
          # CHUNKED PREFILL
          # ---------------------------------------------------------------

          "--max-num-batched-tokens"
          "$${PREFILL_BATCH}"


          # ---------------------------------------------------------------
          # NVFP4 4-BIT KV CACHE
          # ---------------------------------------------------------------

          "--kv-cache-dtype"
          "$${KV_DTYPE}"


          # ---------------------------------------------------------------
          # EXPLICIT WORKSTATION KV BUDGET
          # ---------------------------------------------------------------

          "--kv-cache-memory-bytes"
          "$${KV_CACHE_MEMORY_BYTES}"

          # ---------------------------------------------------------------
          # WEIGHT QUANTIZATION
          #
          # No --quantization flag: this checkpoint is compressed-tensors
          # NVFP4 W4A4 and vLLM auto-detects the recipe from config.json.
          # lm_head, vision, GDN conv1d, and the MTP head remain BF16.
          # ---------------------------------------------------------------


          # ---------------------------------------------------------------
          # FLASHINFER
          # ---------------------------------------------------------------

          "--attention-backend"
          "FLASHINFER"


          # ---------------------------------------------------------------
          # BLACKWELL NVFP4 LINEAR GEMM
          # ---------------------------------------------------------------

          "--linear-backend"
          "flashinfer_cutlass"


          # ---------------------------------------------------------------
          # GDN PREFILL
          #
          # Use the stable Triton/FLA path that underlies the measured Saka
          # 5090 numbers. This avoids another JIT/autotune variable while the
          # machine is also serving as a desktop workstation.
          # ---------------------------------------------------------------

          "--gdn-prefill-backend"
          "triton"


          # ---------------------------------------------------------------
          # CRITICAL RTX 5090 STABILITY FIX
          #
          # The previous checkpoint reached FlashInfer FP4 GEMM autotuning and
          # OOMed while creating temporary profiling tensors at 20/21.
          #
          # Disable live FlashInfer autotuning.
          #
          # FlashInfer/vLLM will use its normal fallback/default tactic
          # instead of allocating the large temporary tuning workspace.
          # ---------------------------------------------------------------

          "--no-enable-flashinfer-autotune"


          # ---------------------------------------------------------------
          # LONG-CONTEXT SCHEDULING
          # ---------------------------------------------------------------

          "--enable-chunked-prefill"


          # ---------------------------------------------------------------
          # CLAUDE CODE PREFIX REUSE
          # ---------------------------------------------------------------

          "--enable-prefix-caching"


          # ---------------------------------------------------------------
          # QWEN HYBRID STATE ALIGNMENT
          # ---------------------------------------------------------------

          "--mamba-cache-mode"
          "align"


          # ---------------------------------------------------------------
          # SINGLE-USER / INTERACTIVE WORKSTATION PROFILE
          # ---------------------------------------------------------------

          "--performance-mode"
          "interactivity"


          # ---------------------------------------------------------------
          # REQUEST LOGGING
          #
          # Full request-body logging intentionally disabled for throughput.
          # ---------------------------------------------------------------



          # ---------------------------------------------------------------
          # LOW-OVERHEAD PERFORMANCE OBSERVABILITY
          #
          # Retain sampled KV-cache metrics. CUDA-graph metrics, MFU metrics,
          # per-request dumps, per-iteration details, and JIT verbose logging
          # are disabled in this production-speed profile.
          # ---------------------------------------------------------------

          "--kv-cache-metrics"

          "--kv-cache-metrics-sample"
          "$${KV_CACHE_METRICS_SAMPLE}"




          # ---------------------------------------------------------------
          # MODEL
          # ---------------------------------------------------------------

          "--trust-remote-code"


          # ---------------------------------------------------------------
          # THINKING HARD OFF — V2
          #
          # Do NOT configure --reasoning-parser on this Claude Code endpoint.
          # With Anthropic /v1/messages, parsed reasoning becomes `thinking`
          # content blocks. The Qwen template is forced to non-thinking above.
          # ---------------------------------------------------------------

          "--default-chat-template-kwargs"
          '{"enable_thinking":false,"preserve_thinking":false}'


          # ---------------------------------------------------------------
          # TOOL CALLING
          # ---------------------------------------------------------------

          "--enable-auto-tool-choice"


          "--tool-call-parser"
          "qwen3_coder"

        )


        #######################################################################
        # MTP SPECULATIVE DECODING
        #
        # ON for this checkpoint; BF16 draft head is preserved and indexed.
        #######################################################################

        if [ "$${USE_MTP}" = "on" ]; then


          echo
          echo "MTP ENABLED: $${MTP_TOKENS} speculative tokens"
          echo


          VLLM_ARGS+=(

            "--speculative-config"

            "{\"method\":\"mtp\",\"num_speculative_tokens\":$${MTP_TOKENS}}"

          )


        else


          echo
          echo "MTP OFF — manual fallback mode"
          echo


        fi


        #######################################################################
        # OPTIONAL DEEP DEBUG (OFF IN SPEED PROFILE)
        #######################################################################

        if [ "$${LOCAL_DEEP_DEBUG:-0}" = "1" ]; then


          echo
          echo "======================================================================"
          echo " DEEP DEBUG ENABLED"
          echo "======================================================================"
          echo


          VLLM_ARGS+=(

            "--enable-logging-iteration-details"

            "--jit-monitor-verbose"

          )


        fi


        #######################################################################
        # FINAL CONFIG
        #######################################################################

        echo
        echo "======================================================================"
        echo " STARTING vLLM"
        echo "======================================================================"
        echo " vLLM                 : 0.28.0 + SM120 patch stack"
        echo " Model                : Huihui Qwen3.8-27B Abliterated NVFP4"
        echo " Context              : $${MAX_CONTEXT}"
        echo " Weight quant         : compressed-tensors NVFP4 W4A4"
        echo " KV quant             : $${KV_DTYPE}"
        echo " KV cache budget      : $${KV_CACHE_MEMORY_BYTES} explicit"
        echo " Max seqs             : $${MAX_SEQS}"
        echo " Prefill chunk        : $${PREFILL_BATCH}"
        echo " Prefix cache         : ON"
        echo " FlashInfer           : ON"
        echo " FlashInfer autotune  : OFF"
        echo " SM120 NVFP4 preflight: PASS required"
        echo " MTP                  : $${USE_MTP}"
        echo " MTP speculative depth: $${MTP_TOKENS}"
        echo " Thinking             : HARD OFF V2 (no reasoning parser)"
        echo " vLLM log level       : $${VLLM_LOGGING_LEVEL}"
        echo " Stats                : every $${VLLM_LOG_STATS_INTERVAL} sec"
        echo " Iteration detail     : OFF"
        echo " JIT verbose          : OFF"
        echo " KV residency metrics : ON ($${KV_CACHE_METRICS_SAMPLE} sample)"
        echo " CUDA graph metrics   : OFF"
        echo " MFU metrics          : OFF"
        echo "======================================================================"
        echo


        echo "Executing:"
        echo


        printf ' %q' \
          vllm \
          serve \
          "$${VLLM_ARGS[@]}"


        echo
        echo


        #######################################################################
        # PERIODIC PROMETHEUS SNAPSHOTS
        #######################################################################

        export PROMETHEUS_LOG="$${LOG_DIR}/prometheus-$${RUN_ID}.log"

        python3 -u - <<'PYMETRICS' &
        import os
        import time
        import urllib.request
        from datetime import datetime, timezone

        output = os.environ["PROMETHEUS_LOG"]
        interval = float(os.environ.get("PROMETHEUS_SNAPSHOT_INTERVAL_SEC", "10"))
        url = "http://127.0.0.1:8006/metrics"
        with open(output, "a", buffering=1) as handle:
            while True:
                try:
                    with urllib.request.urlopen(url, timeout=2) as response:
                        payload = response.read().decode("utf-8", errors="replace")
                    stamp = datetime.now(timezone.utc).isoformat()
                    handle.write(f"\n# ===== SNAPSHOT {stamp} =====\n")
                    handle.write(payload)
                    if not payload.endswith("\n"):
                        handle.write("\n")
                except Exception:
                    pass
                time.sleep(interval)
        PYMETRICS

        echo "Prometheus snapshots : $${PROMETHEUS_LOG}"


        #######################################################################
        # START
        #######################################################################

        exec \
          vllm \
          serve \
          "$${VLLM_ARGS[@]}"


    # =========================================================================
    # HEALTH CHECK
    # =========================================================================

    healthcheck:

      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8006/health',
          timeout=5
          ).read()"

      interval: 30s

      timeout: 10s

      retries: 20

      start_period: 45m


# =============================================================================
# PERSISTENT CACHE VOLUMES
# =============================================================================

volumes:

  qwen5090_vllm_cache:

  qwen5090_triton_cache:

  qwen5090_torch_cache:

  qwen5090_flashinfer_cache: