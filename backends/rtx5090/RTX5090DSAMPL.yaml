            raise RuntimeError(
                "Unable to locate Qwen3.8 chat-template hard-off patch point."
            )

        text = text.replace(
            needle,
            hard_block + needle,
            1,
        )

        # Fail closed. Do not launch a model that can silently fall back to
        # thinking mode.
        if "{%- set enable_thinking = false %}" not in text:
            raise RuntimeError("enable_thinking hard-off injection failed.")

        if "{%- set preserve_thinking = false %}" not in text:
            raise RuntimeError("preserve_thinking hard-off injection failed.")

        path.write_text(text, encoding="utf-8")

