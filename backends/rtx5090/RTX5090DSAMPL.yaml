# =============================================================================
# RTX 5090 — Huihui Qwen3.8-27B Abliterated
# vLLM 0.28.0 + SM120 NVFP4 KV/XQA + production-speed observability
#
# SINGLE PORTAINER YAML
#
# - Full 262,144 context
# - Huihui abliterated Qwen3.8-27B compressed-tensors NVFP4 W4A4
# - NVFP4 4-bit KV cache
# - RTX 5090 / SM120 patch stack pinned to a known-good commit and installed automatically
# - FlashInfer attention
# - FlashInfer LIVE AUTOTUNING OFF  <-- prevents FP4 tuner OOM
# - Prefix caching ON
# - Chunked prefill ON
# - BF16 MTP head preserved; MTP speculative decoding ON at n=4
# - ReplaySSM-spec 0111 intentionally omitted (requires mamba-cache-mode none)
# - Explicit 7 GiB NVFP4 KV cache cap; keeps 262K while reclaiming workstation VRAM
# - Model/patch downloads capped at 25 MiB/s with 2-second progress + ETA
# - Low-overhead production logging + persistent GPU/system/Prometheus telemetry
# - THINKING HARD OFF V2: enable_thinking=false + preserve_thinking=false
# - NO reasoning parser: prevents Anthropic /v1/messages from surfacing output as thinking blocks
# =============================================================================


x-router-manifest:
  schema_version: "1.0"

  instance:
    id: "rtx5090-qwen38-262k-01"
    display_name: "RTX 5090 Huihui Qwen3.8-27B Abliterated NVFP4 262K"
    enabled: true

  host:
    name: "rtx5090"
    gpu_class: "RTX_5090"
    gpu_count: 1

  runtime:
    type: "vllm"
    version: "0.28.0"
    api_family: "openai"
    published_port: 8201
    container_port: 8006

  model:
    canonical_name: "Huihui-Qwen3.8-27B-abliterated-NVFP4"
    served_model_name: "qwen3.8"
    repository: "sakamakismile/Huihui-Qwen3.8-27B-abliterated-NVFP4"
    quantization: "compressed_tensors_nvfp4"

  capabilities:
    text: true
    vision: false
    tools: true
    streaming: true
    reasoning: false

  context:
    max_context_tokens: 262144

  request_format:
    tool_schema: "openai"
    tool_call_parser: "qwen3_coder"
    reasoning_parser: "none"
    chat_template_policy: "local-patched-qwen3.8-thinking-hard-off-v2-no-reasoning-parser"

  behavior:
    thinking_mode: false

  routing:
    static_capacity: 1
    priority: 10
    pool: "coding"
    context_class: "262k"
    signature_group: "qwen38-coding-thinking-hard-off-mtp4"

  observability:
    health_path: "/health"
    models_path: "/v1/models"
    metrics_path: "/metrics"


services:

  qwen38-vllm-5090:

    image: "vllm/vllm-openai:v0.28.0"
    pull_policy: if_not_present

    container_name: qwen38-vllm-5090
    hostname: qwen38-vllm-5090

    restart: unless-stopped
    init: true
    ipc: host

    stop_grace_period: 2m


    # =========================================================================
    # ROUTER LABELS
    # =========================================================================

    labels:

      ai.router.enabled: "true"
      ai.router.schema-version: "1.0"

      ai.router.instance-id: "rtx5090-qwen38-262k-01"
      ai.router.host: "rtx5090"

      ai.router.runtime: "vllm"
      ai.router.runtime-version: "0.28.0"
      ai.router.api-family: "openai"

      ai.router.published-port: "8201"
      ai.router.container-port: "8006"

      ai.router.model-family: "qwen3.8"
      ai.router.model: "Huihui-Qwen3.8-27B-abliterated-NVFP4"
      ai.router.served-model-name: "qwen3.8"

      ai.router.quantization: "compressed_tensors_nvfp4"

      ai.router.context: "262144"
      ai.router.context-class: "262k"

      ai.router.text: "true"
      ai.router.vision: "false"

      ai.router.tools: "true"
      ai.router.streaming: "true"

      ai.router.thinking-mode: "false"

      ai.router.tool-schema: "openai"
      ai.router.tool-call-parser: "qwen3_coder"
      ai.router.reasoning-parser: "none"

      ai.router.chat-template-policy: "local-patched-qwen3.8-thinking-hard-off-v2-no-reasoning-parser"
      ai.router.signature-group: "qwen38-coding-thinking-hard-off-mtp4"

      ai.router.pool: "coding"
      ai.router.capacity: "1"
      ai.router.priority: "10"

      ai.router.health-path: "/health"
      ai.router.models-path: "/v1/models"
      ai.router.metrics-path: "/metrics"


    # =========================================================================
    # NETWORK
    # =========================================================================

    ports:
      - "8201:8006"


    # =========================================================================
    # ENVIRONMENT
    # =========================================================================

    environment:

      # -----------------------------------------------------------------------
      # NVIDIA
      # -----------------------------------------------------------------------

      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_DEVICE_ORDER: "PCI_BUS_ID"
      CUDA_MODULE_LOADING: "LAZY"


      # -----------------------------------------------------------------------
      # MODEL
      # -----------------------------------------------------------------------

      MODEL_REPO: "sakamakismile/Huihui-Qwen3.8-27B-abliterated-NVFP4"
      MODEL_REVISION: "36276309d30211d9babf72f22d1605dc2dc6357c"
      PATCH_REPO_COMMIT: "dd6801ed1d7a3f309096840e567a063335ff72d0"
      MODEL_DIR: "/models/Huihui-Qwen3.8-27B-abliterated-NVFP4"

      HF_HOME: "/models/.cache/huggingface"
      HUGGINGFACE_HUB_CACHE: "/models/.cache/huggingface/hub"

      HF_TOKEN: "${HF_TOKEN:-}"


      # -----------------------------------------------------------------------
      # DOWNLOAD LIMIT
      #
      # 25 MiB/sec
      #
      # 25 * 1024 * 1024 = 26,214,400 bytes/sec
      # -----------------------------------------------------------------------

      DOWNLOAD_LIMIT_BPS: "26214400"
      DOWNLOAD_PROGRESS_INTERVAL_SEC: "2"


      # -----------------------------------------------------------------------
      # CONTEXT
      # -----------------------------------------------------------------------

      MAX_CONTEXT: "262144"

      MAX_SEQS: "1"

      PREFILL_BATCH: "4096"


      # -----------------------------------------------------------------------
      # GPU / KV MEMORY
      #
      # IMPORTANT:
      # Use an EXPLICIT KV cache budget instead of gpu-memory-utilization.
      #
      # Previous 0.93 auto-sizing allocated ~9.75 GiB NVFP4 KV and a
      # 453,897-token cache although the API context limit is 262,144.
      # On this Windows/WDDM workstation dedicated VRAM reached ~31.2/31.5 GB.
      #
      # 7 GiB should still provide ~320K+ NVFP4 KV tokens while returning
      # roughly ~2.75 GiB VRAM headroom to the workstation.
      #
      # vLLM 0.28: --kv-cache-memory-bytes overrides gpu-memory-utilization,
      # so the latter is intentionally not passed.
      # -----------------------------------------------------------------------

      KV_CACHE_MEMORY_BYTES: "7G"

      KV_DTYPE: "nvfp4"


      # -----------------------------------------------------------------------
      # MTP
      #
      # This checkpoint preserves the 15 MTP modules in BF16 and wires them
      # into the safetensors index. Use n=4 for the RTX 5090 speed profile.
      # -----------------------------------------------------------------------

      USE_MTP: "on"

      MTP_TOKENS: "4"


      # -----------------------------------------------------------------------
      # CUDA / PYTORCH
      # -----------------------------------------------------------------------

      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"


      # -----------------------------------------------------------------------
      # FLASHINFER
      # -----------------------------------------------------------------------

      VLLM_USE_FLASHINFER_SAMPLER: "1"

      VLLM_FLASHINFER_WORKSPACE_BUFFER_SIZE: "134217728"

      # Explicit SM120 patched-path switches.
      VLLM_SM12X_NVFP4_XQA: "1"
      VLLM_SM12X_XQA_VERIFY: "1"


      # -----------------------------------------------------------------------
      # COMPILATION
      # -----------------------------------------------------------------------

      TORCHINDUCTOR_COMPILE_THREADS: "8"

      MAX_JOBS: "4"

      FLASHINFER_NUM_COMPILE_JOBS: "4"

      PYTHONHASHSEED: "0"


      # -----------------------------------------------------------------------
      # PRODUCTION-SPEED LOGGING / OBSERVABILITY
      #
      # Keep server stats and low-rate KV metrics, but do not serialize entire
      # prompts/token IDs or emit per-iteration/JIT/CUDA-graph/MFU debug spam.
      # -----------------------------------------------------------------------

      VLLM_LOGGING_LEVEL: "INFO"

      VLLM_LOG_STATS_INTERVAL: "2"

      LOCAL_DEEP_DEBUG: "0"

      # Low-overhead KV residency sampling.
      KV_CACHE_METRICS_SAMPLE: "0.01"

      LOG_DIR: "/logs"
      GPU_TELEMETRY_INTERVAL_SEC: "1"
      SYSTEM_TELEMETRY_INTERVAL_SEC: "1"
      PROMETHEUS_SNAPSHOT_INTERVAL_SEC: "10"


    # =========================================================================
    # STORAGE
    # =========================================================================

    volumes:

      - /home/darkmatter2222/models:/models

      # Persistent diagnostic logs survive container recreation.
      - /home/darkmatter2222/qwen5090-logs:/logs

      - qwen5090_vllm_cache:/root/.cache/vllm
      - qwen5090_triton_cache:/root/.triton
      - qwen5090_torch_cache:/root/.cache/torch
      - qwen5090_flashinfer_cache:/root/.cache/flashinfer


    # =========================================================================
    # GPU
    # =========================================================================

    deploy:

      resources:

        reservations:

          devices:

            - driver: nvidia
              count: 1

              capabilities:
                - gpu


    # =========================================================================
    # ULIMITS
    # =========================================================================

    ulimits:

      memlock:
        soft: -1
        hard: -1

      stack:
        soft: 67108864
        hard: 67108864


    # =========================================================================
    # LOG ROTATION
    # =========================================================================

    logging:

      driver: json-file

      options:
        max-size: "1g"
        max-file: "20"


    # =========================================================================
    # ENTRYPOINT
    # =========================================================================

    entrypoint:
      - /bin/bash
      - -lc


    command:
      - |

        set -Eeuo pipefail


        #######################################################################
        # PERSISTENT CONSOLE LOG
        #######################################################################

        mkdir -p "$${LOG_DIR}"
        RUN_ID="$$(date -u +%Y%m%dT%H%M%SZ)"
        export RUN_ID
        CONSOLE_LOG="$${LOG_DIR}/vllm-console-$${RUN_ID}.log"
        exec > >(tee -a "$${CONSOLE_LOG}") 2>&1
        echo "Persistent console log: $${CONSOLE_LOG}"


        #######################################################################
        # BANNER
        #######################################################################

        echo
        echo "======================================================================"
        echo " Huihui Qwen3.8-27B Abliterated — RTX 5090"
        echo " vLLM 0.28.0 + SM120 NVFP4 KV + XQA"
        echo "======================================================================"
        echo " Context             : $${MAX_CONTEXT}"
        echo " Max sequences       : $${MAX_SEQS}"
        echo " Prefill chunk       : $${PREFILL_BATCH}"
        echo " Weight format       : compressed-tensors NVFP4 W4A4"
        echo " KV format           : $${KV_DTYPE}"
        echo " KV cache budget     : $${KV_CACHE_MEMORY_BYTES} explicit"
        echo " MTP                 : $${USE_MTP}"
        echo " Prefix cache        : ON"
        echo " FlashInfer autotune : OFF"
        echo " SM120 NVFP4 preflight: ON"
        echo " vLLM logging        : $${VLLM_LOGGING_LEVEL}"
        echo " Deep debug          : $${LOCAL_DEEP_DEBUG}"
        echo " GPU telemetry       : every $${GPU_TELEMETRY_INTERVAL_SEC}s"
        echo " Metrics snapshots   : every $${PROMETHEUS_SNAPSHOT_INTERVAL_SEC}s"
        echo " Patch commit        : $${PATCH_REPO_COMMIT}"
        echo " Download cap        : 25 MiB/sec"
        echo " Download progress   : every $${DOWNLOAD_PROGRESS_INTERVAL_SEC}s"
        echo "======================================================================"
        echo


        #######################################################################
        # VERIFY BASE IMAGE
        #######################################################################

        python3 - <<'PY'

        import vllm

        print(
            "Base vLLM version:",
            vllm.__version__,
            flush=True,
        )

        if not str(
            vllm.__version__
        ).startswith("0.28.0"):

            raise RuntimeError(
                f"Expected vLLM 0.28.0, got {vllm.__version__}"
            )

        PY


        #######################################################################
        # INSTALL PATCH UTILITY
        #
        # apt downloads are also limited to approximately 25 MiB/s.
        #######################################################################

        if ! command -v patch >/dev/null 2>&1; then

          echo
          echo "Installing patch utility..."
          echo


          apt-get \
            -o Acquire::http::Dl-Limit=25600 \
            -o Acquire::https::Dl-Limit=25600 \
            update -qq


          DEBIAN_FRONTEND=noninteractive \
          apt-get \
            -o Acquire::http::Dl-Limit=25600 \
            -o Acquire::https::Dl-Limit=25600 \
            install \
            -y \
            -qq \
            patch \
            >/dev/null


          rm -rf \
            /var/lib/apt/lists/*

        fi


        #######################################################################
        # RTX 5090 / SM120 PATCH STACK
        #
        # Reproducibility:
        # - repo commit is pinned; never follows moving main
        # - vLLM source is pinned to tag v0.28.0
        # - Python diffs patch pristine source, then patched files are copied
        #   into the installed package
        #######################################################################

        if [ ! -f /opt/vllm-sm12x/.PATCHED_OK ]; then

          echo
          echo "======================================================================"
          echo " INSTALLING RTX 5090 SM120 PATCH STACK"
          echo "======================================================================"
          echo


          rm -rf \
            /opt/qwen5090-repo \
            /opt/vllm-src \
            /opt/vllm-sm12x \
            /tmp/qwen5090-pinned.tar.gz \
            /tmp/vllm-v0280.tar.gz


          #####################################################################
          # DOWNLOAD PATCH SOURCES
          #
          # SERIAL + 25 MiB/s
          #####################################################################

          python3 - <<'PY'

        import os
        import time
        import tarfile
        import shutil

        from pathlib import Path

        import requests


        RATE = int(
            os.environ.get(
                "DOWNLOAD_LIMIT_BPS",
                "26214400",
            )
        )


        PROGRESS_INTERVAL = float(
            os.environ.get(
                "DOWNLOAD_PROGRESS_INTERVAL_SEC",
                "2",
            )
        )


        def format_eta(seconds):
            if seconds is None:
                return "?"
            seconds = max(0, int(seconds))
            minutes, seconds = divmod(seconds, 60)
            hours, minutes = divmod(minutes, 60)
            if hours:
                return f"{hours:d}h{minutes:02d}m{seconds:02d}s"
            if minutes:
                return f"{minutes:d}m{seconds:02d}s"
            return f"{seconds:d}s"


        def download(
            url,
            destination,
        ):

            destination = Path(
                destination
            )


            print(
                f"GET: {url}",
                flush=True,
            )


            response = requests.get(
                url,
                stream=True,
                timeout=(30, 300),
            )


            response.raise_for_status()


            total = int(
                response.headers.get(
                    "Content-Length",
                    "0",
                )
                or 0
            )

            downloaded = 0

            started = time.monotonic()
            last_report = started


            if total:
                print(
                    f"DOWNLOAD START: {destination.name} "
                    f"0.0 / {total / 1024 / 1024:.1f} MiB (0.0%)",
                    flush=True,
                )
            else:
                print(
                    f"DOWNLOAD START: {destination.name} "
                    "(server did not provide total size)",
                    flush=True,
                )


            with destination.open(
                "wb"
            ) as handle:

                for chunk in response.iter_content(
                    chunk_size=1024 * 1024
                ):

                    if not chunk:
                        continue


                    handle.write(
                        chunk
                    )


                    downloaded += len(
                        chunk
                    )


                    target_elapsed = (
                        downloaded
                        / RATE
                    )


                    actual_elapsed = (
                        time.monotonic()
                        - started
                    )


                    if (
                        target_elapsed
                        > actual_elapsed
                    ):

                        time.sleep(
                            target_elapsed
                            - actual_elapsed
                        )


                    now = time.monotonic()

                    if (
                        now - last_report >= PROGRESS_INTERVAL
                        or (total and downloaded >= total)
                    ):
                        elapsed = max(now - started, 0.001)
                        speed = downloaded / elapsed / 1024 / 1024

                        if total:
                            pct = min(100.0, downloaded * 100.0 / total)
                            remaining = max(0, total - downloaded)
                            eta = remaining / max(speed * 1024 * 1024, 1)
                            print(
                                f"DOWNLOAD: {destination.name} "
                                f"{downloaded / 1024 / 1024:.1f} / "
                                f"{total / 1024 / 1024:.1f} MiB "
                                f"({pct:5.1f}%) "
                                f"{speed:.1f} MiB/s ETA {format_eta(eta)}",
                                flush=True,
                            )
                        else:
                            print(
                                f"DOWNLOAD: {destination.name} "
                                f"{downloaded / 1024 / 1024:.1f} MiB "
                                f"{speed:.1f} MiB/s",
                                flush=True,
                            )

                        last_report = now


            response.close()


            elapsed = max(
                time.monotonic() - started,
                0.001,
            )

            print(
                f"DONE: {destination} "
                f"({downloaded / 1024 / 1024:.1f} MiB, "
                f"{downloaded / elapsed / 1024 / 1024:.1f} MiB/s)",
                flush=True,
            )


        patch_commit = os.environ[
            "PATCH_REPO_COMMIT"
        ]

        print(
            f"Pinned patch commit: {patch_commit}",
            flush=True,
        )

        download(
            "https://github.com/"
            "adrienbrault/"
            "qwen3.8-27b-rtx5090/"
            f"archive/{patch_commit}.tar.gz",
            "/tmp/qwen5090-pinned.tar.gz",
        )


        download(
            "https://github.com/"
            "vllm-project/vllm/"
            "archive/refs/tags/v0.28.0.tar.gz",
            "/tmp/vllm-v0280.tar.gz",
        )


        print(
            "Extracting patch sources...",
            flush=True,
        )


        with tarfile.open(
            "/tmp/qwen5090-pinned.tar.gz",
            "r:gz",
        ) as archive:

            archive.extractall(
                "/tmp"
            )


        with tarfile.open(
            "/tmp/vllm-v0280.tar.gz",
            "r:gz",
        ) as archive:

            archive.extractall(
                "/tmp"
            )


        candidates = sorted(
            Path("/tmp").glob(
                "qwen3.8-27b-rtx5090-*"
            )
        )

        candidates = [
            path
            for path in candidates
            if path.is_dir()
        ]

        if len(candidates) != 1:

            raise RuntimeError(
                "Expected exactly one extracted patch source, "
                f"found: {candidates}"
            )

        qsrc = candidates[0]


        vsrc = Path(
            "/tmp/vllm-0.28.0"
        )


        if not qsrc.exists():

            raise RuntimeError(
                f"Patch source missing: {qsrc}"
            )


        if not vsrc.exists():

            raise RuntimeError(
                f"vLLM source missing: {vsrc}"
            )


        shutil.move(
            str(qsrc),
            "/opt/qwen5090-repo",
        )


        shutil.move(
            str(vsrc),
            "/opt/vllm-src",
        )


        print(
            "Patch sources ready.",
            flush=True,
        )

        print(
            f"Patch source commit: {patch_commit}",
            flush=True,
        )

        PY


          P="/opt/qwen5090-repo/patches-v0280"


          if [ ! -d "$${P}" ]; then

            echo
            echo "FATAL: patches-v0280 not found."
            echo

            exit 80

          fi


          #####################################################################
          # EXACT PATCH FUNCTION
          #
          # All vLLM Python diffs are now applied to a pristine, pinned
          # v0.28.0 source tree instead of directly to the installed wheel.
          # This removes the package-layout/context mismatch that caused 0101
          # to fail repeatedly. Fuzz is disabled and failures print full output.
          #####################################################################

          apply_patch_exact() {

            TARGET="$$1"
            DIFF="$$2"

            echo
            echo "Patch (exact): $${DIFF}"
            echo "Target       : $${TARGET}"

            PATCH_LOG="$${LOG_DIR}/patch-$$(basename "$${DIFF}").$${RUN_ID}.log"

            set +e

            patch               --batch               --forward               --fuzz=0               -p1               -d "$${TARGET}"               < "$${DIFF}"               > >(tee "$${PATCH_LOG}")               2>&1

            RC=$$?

            set -e

            if [ "$${RC}" -eq 0 ]; then
              echo "Patch applied cleanly."
              return 0
            fi

            echo
            echo "======================================================================"
            echo " FATAL: EXACT PATCH FAILED"
            echo "======================================================================"
            echo "Target : $${TARGET}"
            echo "Diff   : $${DIFF}"
            echo "Log    : $${PATCH_LOG}"
            echo "Exit   : $${RC}"
            echo
            echo "Last 120 patch-log lines:"
            tail -120 "$${PATCH_LOG}" || true
            echo
            echo "No restart-loop ambiguity: this is a deterministic pinned-source failure."
            echo

            exit 81
          }


          #####################################################################
          # PYTORCH SHADOW HEADER
          #####################################################################

          TINC="$$(

            python3 - <<'PY'

        import os
        import torch


        print(
            os.path.join(
                os.path.dirname(
                    torch.__file__
                ),
                "include",
            )
        )

        PY

          )"


          if grep \
            -q \
            "auto strptr = new std::string" \
            "$${TINC}/torch/csrc/stable/stableivalue_conversions.h"; then


            mkdir \
              -p \
              /opt/vllm-sm12x/shadow-include/torch/csrc/stable


            cp \
              "$${TINC}/torch/csrc/stable/stableivalue_conversions.h" \
              /opt/vllm-sm12x/shadow-include/torch/csrc/stable/


            apply_patch_exact \
              "/opt/vllm-sm12x/shadow-include" \
              "/opt/vllm-src/cmake/patches/pytorch_stable_string.patch"

          fi


          #####################################################################
          # NVFP4 LINEAR V-SCALE WRITER
          #####################################################################

          apply_patch_exact \
            "/opt/vllm-src" \
            "$${P}/0102-nvfp4-writer-linear-vscale-sm12x-v0280.diff"


          grep \
            -q \
            "swizzle_v_sf" \
            /opt/vllm-src/csrc/libtorch_stable/nvfp4_kv_cache_kernels.cu


          #####################################################################
          # COPY SM120 OVERLAY
          #####################################################################

          mkdir \
            -p \
            /opt/vllm-sm12x


          cp \
            -a \
            "$${P}/overlay/." \
            /opt/vllm-sm12x/


          export \
            VLLM_SM12X_SHADOW_INC=/opt/vllm-sm12x/shadow-include


          export \
            VLLM_SM12X_CSRC=/opt/vllm-src/csrc


          export \
            VLLM_SM12X_BUILD=/opt/vllm-sm12x/build


          export \
            VLLM_SM12X_ARCH=120a


          export \
            PYTHONPATH="/opt/vllm-sm12x:$${PYTHONPATH:-}"


          export \
            TORCH_CUDA_ARCH_LIST="12.0a"


          export \
            MAX_JOBS=4


          if ! command \
            -v \
            nvcc \
            >/dev/null 2>&1; then

            export \
              PATH="/usr/local/cuda/bin:$${PATH}"

          fi


          echo
          echo "CUDA compiler:"
          echo


          nvcc \
            --version \
            | tail -1


          echo


          cd \
            /opt/vllm-sm12x


          python3 \
            build_overlay.py


          test \
            -f \
            /opt/vllm-sm12x/build/vllm_sm12x_nvfp4kv.so


          #####################################################################
          # PATCH PRISTINE vLLM v0.28.0 SOURCE, THEN INSTALL TO RUNTIME PACKAGE
          #
          # IMPORTANT:
          # We intentionally do NOT patch /usr/local/lib/.../vllm directly.
          # The installed wheel/package can differ slightly from the source
          # contexts used to author the patch stack, which is what caused the
          # previous 0101 restart loop.
          #
          # Instead:
          #   1. apply every Python patch exactly to /opt/vllm-src/vllm
          #   2. discover every file touched by those diffs
          #   3. copy the resulting patched files into the installed package
          #   4. py_compile + semantic assertions before serving
          #####################################################################

          # Resolve site-packages WITHOUT importing vLLM.
          #
          # With DEBUG logging enabled, importing vllm emits platform-detection
          # messages to stdout. Using that import inside command substitution
          # polluted VROOT with the debug log plus the real path.
          #
          # sysconfig is stdlib-only and produces exactly one clean path.
