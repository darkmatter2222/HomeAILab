        legacy_block = (
            "{# LOCAL_FORCE_THINKING_OFF #}\n"
            "{%- set enable_thinking = false %}\n"
        )

        hard_block = (
            "{# LOCAL_FORCE_THINKING_HARD_OFF_V2 #}\n"
            "{%- set enable_thinking = false %}\n"
            "{%- set preserve_thinking = false %}\n"
        )

