# ============================================================================
# qwen38 Router UI — simple real-time traffic dashboard
#
# Served on :8090, behind HTTP basic auth (from .env, not on the router).
#   username : operator      (UI_UI_USER in .env)
#   password : <from .env>   (UI_UI_PASS in .env)
#
# It shows live per-backend traffic (busy vs live capacity, in-flight, ok/err
# req counts, bytes). It reads from the GPU router's /router/status and
# /router/health (both open, key not required) so the browser only needs the
# UI's own basic-auth credentials.
#
# Self-contained: python:3.11-slim serves a bind-mounted ui.html via a tiny
# inline HTTP server (no pip deps -> nothing to download, so the 25 MiB/s cap
# is trivially satisfied). Deploy via Portainer (endpoint 3 / Databrick).
# ============================================================================
services:
  qwen38-router-ui:
    image: python:3.11-slim
    pull_policy: always
    container_name: qwen38-router-ui
    hostname: qwen38-router-ui
    restart: unless-stopped
    init: true
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "8090:8090"
    environment:
      # From .env: UI_UI_USER / UI_UI_PASS (real values, gitignored)
      UI_USER: "${UI_UI_USER:-operator}"
      UI_PASS: "${UI_UI_PASS:?UI_UI_PASS not set (see .env)}"
      ROUTER_HOST: "host.docker.internal"
      ROUTER_PORT: "8010"
      UI_PORT: "8090"

    volumes:
      - /home/darkmatter2222/qwen38-router/ui.html:/opt/ui/ui.html:ro

    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -Eeuo pipefail
        echo "router UI: user=$${UI_USER}  router=$${ROUTER_HOST}:$${ROUTER_PORT}"
        exec python - <<'PYEOF'
        import base64, http.server, os, socketserver, urllib.request

        USER = os.environ.get("UI_USER", "operator")
        PASS = os.environ.get("UI_PASS", "")
        ROUTER = os.environ.get("ROUTER_HOST", "host.docker.internal")
        RPORT  = os.environ.get("ROUTER_PORT", "8010")
        PORT   = int(os.environ.get("UI_PORT", "8090"))
        UIFILE = "/opt/ui/ui.html"

        good = "Basic " + base64.b64encode(f"{USER}:{PASS}".encode()).decode()

        class H(http.server.BaseHTTPRequestHandler):
            server_version = "qwen38-ui/1.0"

            def _auth_ok(self):
                return self.headers.get("Authorization", "") == good

            def _send(self, code, body, ctype="text/html; charset=utf-8"):
                self.send_response(code)
                self.send_header("Content-Type", ctype)
                self.send_header("Content-Length", str(len(body)))
                self.send_header("Connection", "close")
                self.end_headers()
                try: self.wfile.write(body)
                except BrokenPipeError: pass

            def log_message(self, *a):  # quieter
                pass

            def do_GET(self):
                p = self.path.split("?")[0]
                if p == "/router/status" or p == "/router/health":
                    # proxy so the browser keeps only the basic-auth creds
                    try:
                        with urllib.request.urlopen(f"http://{ROUTER}:{RPORT}{p}", timeout=8) as r:
                            data = r.read()
                        self._send(200, data, "application/json")
                    except Exception as e:
                        self._send(502, f"router unreachable: {e}".encode(), "text/plain")
                    return
                if not self._auth_ok():
                    self.send_response(401)
                    self.send_header("WWW-Authenticate", 'Basic realm="qwen38-router-ui"')
                    self.send_header("Content-Length", "0")
                    self.end_headers()
                    return
                if p in ("/", "/index.html", "/ui.html"):
                    with open(UIFILE, "rb") as f:
                        self._send(200, f.read())
                else:
                    self._send(404, b"not found", "text/plain")

        class S(socketserver.ThreadingMixIn, http.server.HTTPServer):
            daemon_threads = True

        with S(("0.0.0.0", PORT), H) as srv:
            print(f"UI serving on :{PORT} (basic auth {USER})", flush=True)
            srv.serve_forever()
        PYEOF

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8090/router/health',timeout=6); sys.exit(0 if r.status==200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 5m
