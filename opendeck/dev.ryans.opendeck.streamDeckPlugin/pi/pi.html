<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OpenCode Deck</title>
    <style>
      body { font-family: "Segoe UI", Arial, sans-serif; background: #1d1e22; color: #eef1f6; padding: 12px; margin: 0; }
      label { display: block; margin: 10px 0 4px; color: #8b8f9a; font-size: 12px; }
      input { width: 100%; box-sizing: border-box; background: #101114; border: 1px solid #2a2d34; color: #eef1f6; padding: 6px; border-radius: 4px; }
      .hint { color: #8b8f9a; font-size: 11px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <label>Alias (key label)</label>
    <input type="text" id="label" placeholder="homeai" />
    <label>Project path</label>
    <input type="text" id="path" placeholder="C:\Users\ryans\source\repos\HomeAILab" />
    <div class="hint">The working directory OpenCode runs in; used to attribute live sessions to this key.</div>
    <label>Launcher (.bat)</label>
    <input type="text" id="bat" placeholder="C:\Users\ryans\bin\opencode-3090-serve.bat" />
    <div class="hint">Optional: opens a terminal running this launcher in the project dir. Leave blank to just open the folder.</div>
    <script>
      // Stream Deck PI bridge: the host calls window.onSettingsChange etc.
      let currentSettings = {};
      function apply(s) {
        currentSettings = s || {};
        document.getElementById("label").value = s.label || "";
        document.getElementById("path").value = s.path || "";
        document.getElementById("bat").value = s.bat || "";
      }
      function collect() {
        return {
          label: document.getElementById("label").value,
          path: document.getElementById("path").value,
          bat: document.getElementById("bat").value,
        };
      }
      if (window.addEventListener && window.onSettingsChange) {
        window.addEventListener("sd-settings-change", (e) => apply(e.detail || {}));
      }
      document.addEventListener("DOMContentLoaded", () => {
        ["label", "path", "bat"].forEach((id) => {
          document.getElementById(id).addEventListener("change", () => {
            if (window.onSettingsChange) window.onSettingsChange(collect());
          });
        });
      });
    </script>
  </body>
</html>
