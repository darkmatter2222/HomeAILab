[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbench"
version = "0.1.0"
description = "Production-grade single-GPU LLM inference performance benchmarking platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "llmbench maintainers" }]

dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic>=2.7",
    "pyarrow>=15",
    "pandas>=2.0",
    "plotly>=5.20",
    "jinja2>=3.1",
    "aiohttp>=3.9",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
dev = ["ruff>=0.4", "mypy>=1.10"]

[project.scripts]
llmbench = "llmbench.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
