[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-deck"
version = "1.0.0"
description = "Local OpenCode presence and animated Stream Deck Mini controller"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<13", "psutil==7.2.2", "streamdeck==0.10.0", "hidapi==0.15.0"]

[project.scripts]
ocdeck = "ocdeck.__main__:main"

[tool.setuptools]
packages = ["ocdeck"]
